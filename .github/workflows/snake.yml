# Dibuja la serpiente que se come la gráfica de contribuciones del perfil.
# Corre cada 12 horas y deja los SVG en la rama "output".
name: Serpiente de contribuciones

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0B6B45&color_dots=#ebedf0,#a8e6c3,#5ccf8f,#1db86a,#0b6b45
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#1DB86A&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
